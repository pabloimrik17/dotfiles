name: Fallow

on:
    pull_request: {}

permissions:
    contents: read
    checks: write
    pull-requests: write

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: 🔍 Fallow audit
              uses: fallow-rs/fallow@ecf5a314fd3e10974acb4f5a7f867c433030522d # v3.17.0
              with:
                  command: audit
                  gate: new-only
                  comment: true
                  comment-layout: compact
