name: Fallow

on:
    pull_request: {}

permissions:
    contents: read
    checks: write
    pull-requests: write

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: 🔍 Fallow audit
              # actions-up-ignore-next-line
              uses: fallow-rs/fallow@71369f80d099e25726ad04382f15aef14a251abc # v3.31.0
              with:
                  command: audit
                  gate: new-only
                  comment: true
                  comment-layout: compact
