name: CI

on:
    push:
        branches:
            - main
    pull_request: {}

jobs:
    test:
        runs-on: macos-15
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install test prerequisites
              run: |
                  brew install chezmoi jq uv
                  uv tool install --managed-python 'claude-swap[menubar]==0.26.0'
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run tests
              run: bun test

    main:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: 🔍 Check formatting
              run: bun run lint:oxfmt

            - name: 🔍 Validate OpenSpec change proposals
              run: bunx @fission-ai/openspec@1.2.0 validate --changes --no-interactive

            # PRs are gated by fallow.yml (audit, new-only ratchet); this catches
            # dead code landing on main via direct pushes
            - name: 🔍 Fallow dead-code gate (full repo)
              run: bunx fallow dead-code --fail-on-issues
              if: ${{ github.event_name == 'push' }}
