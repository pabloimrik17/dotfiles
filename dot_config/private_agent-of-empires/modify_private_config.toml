#!/bin/sh
# chezmoi modify_ script for ~/.config/agent-of-empires/config.toml (mode 0600 via the
# `private_` attribute). chezmoi pipes the live on-disk config to stdin; we overlay
# ONLY the deliberately-managed keys (MANAGED below) and emit the merged file to
# stdout, leaving AoE's runtime writeback (`[web]`/`[logging]` + default-expanded
# tables) untouched. See improve-aoe-config design D3.
#
# Two tables this comment used to name are gone: `[cockpit]` was renamed `[acp]`
# in aoe 1.11.0 and is deliberately managed below, not runtime writeback; and
# `[app_state]` left this file entirely in 1.13.0 for a sibling `state.toml`,
# which is unmanaged and never touched here.
#
# Engine: `uv run --no-project --with tomlkit python` (uv is in BREW_PACKAGES; no
# new brew dep). tomlkit is style-preserving — `dumps(parse(x)) == x` — so after AoE
# rewrites the file the merge round-trips every untouched table byte-for-byte and
# only genuinely changed managed keys ever show in `chezmoi diff`.
#
# `--no-project` because `chezmoi apply` inherits the directory it was invoked
# from, and without it uv walks upward looking for a project to attach to. Both
# outcomes are bad and both were reproduced on 0.11.26 (pre-existing, not a 0.12.x
# regression): from a project whose deps do not resolve the merge is skipped while
# apply still exits 0, so managed keys silently do not land; from a healthy project
# uv writes `.venv/` and `uv.lock` into that unrelated repo.
#
# Fallbacks: empty stdin (fresh machine) -> managed-only baseline; `uv` absent (cold
# start before the brew bootstrap), the merge exiting non-zero, or output that does
# not re-parse as TOML -> pass the live config through unchanged (the next `chezmoi
# apply` self-heals). The merge is buffered rather than streamed to stdout: chezmoi
# takes a modify_ script's stdout verbatim, so an engine that dies mid-serialization
# would otherwise hand it a truncated document with the whole live file appended.
set -eu

work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
infile="$work/config.toml"
outfile="$work/merged.toml"

# Capture stdin verbatim (byte-exact: no $(cat) trailing-newline stripping).
cat >"$infile"

# uv absent: pass the live config through unchanged and bail.
if ! command -v uv >/dev/null 2>&1; then
  cat "$infile"
  exit 0
fi

prog="$work/merge.py"
cat >"$prog" <<'PYEOF'
import sys
import tomlkit

# (table-path tuple, value, is_literal_string)
# is_literal_string=True -> emit a single-quoted TOML literal to match AoE's own
# serialization of the status_hooks commands (no double-quote escaping churn).
MANAGED = [
    (("theme", "name"), "catppuccin-mocha", False),
    (("theme", "color_mode"), "truecolor", False),
    (("session", "default_tool"), "claude", False),
    (("session", "agent_status_hooks"), True, False),
    # Confirmation guard before deleting a session from the TUI (aoe 1.12.0).
    (("session", "confirm_delete"), True, False),
    # Days a trashed session (transcript + worktree) survives before AoE purges
    # it. Pinned here so the schema default (30) can't drift back in.
    (("session", "trash_retention_days"), 10, False),
    # Auto-resume ACP sessions once the adapter-reported rate-limit reset
    # passes (aoe 1.10.1, opt-in; +15s default grace). Terminal/tmux-view
    # sessions are unaffected; status_hooks below still notify.
    (("acp", "rate_limit_auto_resume"), True, False),
    (("worktree", "init_submodules"), False, False),
    (("tmux", "status_bar"), "disabled", False),
    (("tmux", "clipboard"), "enabled", False),
    # "auto" mirrors ~/.tmux.conf into each session; "disabled" applies `mouse
    # off`, shadowing it. Pinned so `chezmoi apply` reverts a stray value.
    (("tmux", "mouse"), "auto", False),
    (("updates", "update_check_mode"), "off", False),
    (("sound", "enabled"), True, False),
    (("status_hooks", "enabled"), True, False),
    (("status_hooks", "on_waiting"),
     'terminal-notifier -title "aoe: $AOE_SESSION_TITLE" -message "needs input" -sound Glass', True),
    (("status_hooks", "on_idle"),
     'terminal-notifier -title "aoe: $AOE_SESSION_TITLE" -message "done"', True),
    (("status_hooks", "on_error"),
     'terminal-notifier -title "aoe: $AOE_SESSION_TITLE" -message "errored" -sound Basso', True),
    # NVM_DIR lets the claude-node-launch shim resolve the project's Node from
    # $NVM_DIR/versions/node/ when AoE runs claude inside the sandbox (the shim
    # needs the dir, not the nvm shell function). Outside the sandbox (the
    # default — sandbox.enabled_by_default = false) claude inherits the launch
    # shell's PATH and hits the shim regardless. See nvm-aware-claude-launch.
    (("sandbox", "environment"),
     ["CLAUDE_CONFIG_DIR", "EDITOR", "TERM", "COLORTERM", "NVM_DIR"], False),
    (("tools", "lazygit", "command"), "lazygit", False),
    (("tools", "lazygit", "hotkey"), "Alt+g", False),
]

if "--validate" in sys.argv:
    tomlkit.parse(sys.stdin.read())  # gate used by the shell on the merged output
    sys.exit(0)

data = sys.stdin.read()
doc = tomlkit.parse(data) if data.strip() else tomlkit.document()

for path, value, literal in MANAGED:
    node = doc
    # Walk/create intermediate tables. A table that only holds a subtable (any
    # intermediate before the leaf's parent) is a super table so it renders as
    # `[tools.lazygit]` rather than an empty `[tools]` + `[tools.lazygit]`.
    for i, key in enumerate(path[:-1]):
        if key not in node:
            is_super = i < len(path) - 2
            node[key] = tomlkit.table(is_super_table=True) if is_super else tomlkit.table()
        node = node[key]
    leaf = path[-1]
    # check-then-set: skip if the on-disk value already matches (preserves AoE's
    # exact byte formatting -> quiet diff / idempotent re-apply).
    current = node.get(leaf)
    if current is not None and current == value:
        continue
    if literal and isinstance(value, str):
        node[leaf] = tomlkit.string(value, literal=True)
    else:
        node[leaf] = value

sys.stdout.write(tomlkit.dumps(doc))
PYEOF

# Buffer the merge, then gate it: the result reaches the target only if the merge
# exited zero, wrote something, and that something re-parses as TOML. Every other
# path emits the live config unchanged, so `chezmoi apply` never hard-fails and the
# next apply self-heals (offline cold cache, dep-resolution error, engine killed
# mid-write). stderr is deliberately NOT redirected -- chezmoi surfaces it, and it
# is the only indication that an apply silently changed nothing.
if uv run --no-project --quiet --with tomlkit python "$prog" <"$infile" >"$outfile" \
  && [ -s "$outfile" ] \
  && uv run --no-project --quiet --with tomlkit python "$prog" --validate <"$outfile"; then
  cat "$outfile"
else
  cat "$infile"
fi
